# RedmiBook Pro 16 2024（TM2309，Core Ultra 7 155H）— AC 全速档
#
# 由 tuned-ppd 在插电时映射 balanced / performance 档；前身是 config.org
# 已删除的 ac-power-profile 脚本 on 侧。参数语义见 config.org「tuned
# 调优与电源档位」一节的对照表。

[main]
summary=RedmiBook Pro 16 2024 — AC 全速档（EPP performance，外设常开）

[cpu]
energy_performance_preference=performance
min_perf_pct=30

# EC 散热档写 balanced：balanced-performance/performance 需圆孔适配器，
# 纯 Type-C 供电时固件拒绝（EOPNOTSUPP），不写以免每次切档报错
[acpi]
platform_profile=balanced

[audio]
timeout=0

[sysctl]
kernel.timer_migration=0
kernel.nmi_watchdog=0
kernel.soft_watchdog=0

[sysfs]
/sys/devices/system/cpu/intel_pstate/hwp_dynamic_boost=1
/sys/module/workqueue/parameters/power_efficient=N
/sys/module/pcie_aspm/parameters/policy=performance
# 核显 / NVMe / iwlwifi 三件套常开不进 D3（BDF 为本机实测地址）
/sys/bus/pci/devices/0000:00:02.0/power/control=on
/sys/bus/pci/devices/0000:01:00.0/power/control=on
/sys/bus/pci/devices/0000:00:14.3/power/control=on
# iwlwifi MVM 省电方案：1=active（禁省电，低延迟优先）
/sys/module/iwlmvm/parameters/power_scheme=1
/sys/kernel/mm/ksm/pages_to_scan=200
/sys/kernel/mm/ksm/sleep_millisecs=50
/sys/kernel/mm/ksm/run=1
