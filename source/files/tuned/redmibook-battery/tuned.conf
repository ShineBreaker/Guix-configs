# RedmiBook Pro 16 2024（TM2309，Core Ultra 7 155H）— 电池续航档
#
# 由 tuned-ppd 在电池供电时映射 power-saver / balanced 档；前身是
# config.org 已删除的 ac-power-profile 脚本 off 侧。参数语义见
# config.org「tuned 调优与电源档位」一节的对照表。

[main]
summary=RedmiBook Pro 16 2024 — 电池续航档（EPP power，外设自动休眠）

[cpu]
energy_performance_preference=power
min_perf_pct=8

[acpi]
platform_profile=low-power

[audio]
timeout=10

[sysctl]
kernel.timer_migration=1
kernel.nmi_watchdog=0
kernel.soft_watchdog=0

[sysfs]
/sys/devices/system/cpu/intel_pstate/hwp_dynamic_boost=0
/sys/module/workqueue/parameters/power_efficient=Y
/sys/module/pcie_aspm/parameters/policy=powersupersave
/sys/bus/pci/devices/0000:00:02.0/power/control=auto
/sys/bus/pci/devices/0000:01:00.0/power/control=auto
/sys/bus/pci/devices/0000:00:14.3/power/control=auto
# iwlwifi MVM 省电方案：3=低功耗
/sys/module/iwlmvm/parameters/power_scheme=3
/sys/kernel/mm/ksm/run=0
