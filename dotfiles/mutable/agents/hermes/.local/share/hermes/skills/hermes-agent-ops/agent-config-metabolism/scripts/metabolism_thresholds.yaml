# Metabolism check thresholds — edit per setup
# Probe: python3 -c "import yaml; print(yaml.safe_load(open('scripts/metabolism_thresholds.yaml')))"

inject:
  enabled: true
  max_kb: 34                # measured 32.6KB (2026-10-18): 95 skill descriptions 26.4KB +
                            # memory 7.0KB. Trend 25.5 (10-04) -> 27.1 (10-11) -> 32.6 (10-18);
                            # the jump is skill-description enrichment (+5.6KB in one week),
                            # not runaway growth. Policy: cap = measured + ~4% headroom
                            # (08-02: 32 at 30.8). If it trips again before the next quarterly
                            # re-anchor, review description growth and trim — do not re-anchor
                            # blindly.

skill_count:
  enabled: true
  max: 160                  # find $HERMES_HOME/skills -name SKILL.md | wc -l

broken_symlinks:
  enabled: true
  max: 0                    # should always be 0
  # .direnv/ holds nix flake dev-shell profile symlinks — GC-pruned, gitignored, regenerated by direnv on entry
  # Trash: deleted files awaiting purge — tracking them double-counts a cleanup already done
  # browser-use Singleton*: Chromium runtime socket locks, stale after browser exit
  exclude_paths:
    - "hermes-agent/.direnv/**"
    - ".Trash-1000/**"
    - "cache/browser-use/**"

config_exists:
  enabled: true
  files:
    - config.yaml
    - .env
    - auth.json
    - cron/jobs.json

rule_frontmatter:
  enabled: true
  required_fields: [name, description]

json:
  enabled: true
  globs:
    - "*.json"
  # JSONC tolerance (in script) handles tsconfig.json + tsdoc-metadata.json.
  # No path excludes — every JSON file under HERMES_HOME is checked.
  # 0-byte install-state stamps under installs/<key>/inputs/ are recognized in
  # the script (pm/environments.py touch-stamps), not path-excluded.

cron_alive:
  enabled: true
  max_age_days: 7           # tick log must be < this old

pipeline_fresh:
  enabled: true
  max_age_hours: 24         # last session_ts vs now

errors:
  enabled: true
  max_per_day: 5
  window_days: 7            # count only errors inside this rolling window
  log_globs:
    - "logs/*.log"          # scan ALL logs — duplicates and noise surface via signature grouping
  # When real problems exist (e.g. mcp server failing to start, web_server cron
  # import collision), they should be VISIBLE in the report, not excluded. The
  # signature grouping (top-N unique errors) makes a single repeating failure
  # cheap to identify even if the absolute count is large.
  # The threshold is on UNIQUE signatures (independent problems), not total lines.

log_line_cap:
  enabled: true
  max_lines: 100000

task_ledger:
  enabled: false            # turn on if you use kanban
  paths:
    - "kanban/board.json"
    - "todo/store.json"

backup_tmp_pile:
  enabled: true
  max_files: 50
  patterns:
    - "*.bak.*"
    - "*.tmp"
    - "*~"

memory_cache_size:
  enabled: true
  max_mb: 200               # cache/ + audio_cache/ (agent-data caches)
  # exempt_paths: hermes 自管的 seed 缓存，不计入 agent 阈值、单列报告。
  # cache/uv = pm 的 uv 包缓存（pm/packages.py:uv_cache_dir()）——update 流程的
  # `uv sync --offline` 近零成本重建依赖它（docstring: "the blow-away-on-update
  # contract depends on it"），清它是拿磁盘换 update 变慢，不是清垃圾。
  # 独立上限防真膨胀：超 1024MB 仍判 RED。
  exempt_paths: ["cache/uv"]
  exempt_max_mb: 1024

plaintext_secrets:
  enabled: true
  max: 0                    # should always be 0
  grep_patterns:
    - "aws_[A-Za-z0-9]{20,}"
    - "sk-[A-Za-z0-9]{20,}"
    - "ghp_[A-Za-z0-9]{20,}"
    - "xoxb-[A-Za-z0-9]{10,}"
    - "xoxp-[A-Za-z0-9]{10,}"
    - "Bearer eyJ[A-Za-z0-9_-]+\\."
    - "-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----"
  exclude_paths:
    - ".env"                # intentional secrets live here
    - "**/node_modules/**"  # fnmatch needs the **/ prefix to match nested dirs
    - "**/venv/**"           # virtualenvs have library key patterns
    - "**/.venv/**"
    - "**/references/**"    # doc examples may have fake keys (sk-xxx placeholders)
    - "sessions/**"         # session dumps may contain Bearer tokens from API calls
    - "**/tests/**"         # test files use fake keys (ghp_xxx, sk-xxx)
    - "**/.env.example"     # example env files show placeholder shapes
    - "hermes-agent/website/docs/**"  # documentation has example keys
    - "hermes-agent/.direnv/**"  # nix dev-shell profile symlinks; GC-pruned, gitignored, regenerated by direnv
    - "hermes-agent/website/i18n/**"  # translation files mirror docs
    - "**/redact.py"        # secret-detection script has regex patterns that match itself

output:
  log_dir: "cron/output"    # relative to $HERMES_HOME
  keep_logs: 12             # how many recent logs to retain