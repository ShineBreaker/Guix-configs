defaultThinkingLevel: max
theme:
  dark: dark
  light: light
showHardwareCursor: true
startup:
  quiet: true
  changelogMode: summary
compaction:
  enabled: true
  reserveTokens: 16384
  keepRecentTokens: 20000
retry:
  enabled: true
  maxRetries: 3
  baseDelayMs: 2000
skills:
  customDirectories:
    - ~/.config/agents/skills
statusLine:
  preset: default
  separator: powerline-thin
  contextLine: embedded
  transparent: false
  compactThinkingLevel: true
setupVersion: 2
symbolPreset: nerd
providers:
  webSearchOrder:
    []
modelRoles:
  default: opencode-go/muse-spark-1.3-contributor:xhigh
  tiny: opencode-go/hy3:xhigh
  advisor: opencode-go/muse-spark-1.3-contributor
composer:
  shape: box
terminal:
  showProgress: true
tui:
  textSizing: true
display:
  shimmer: kitt
  hideToolActivity: false
  showTokenUsage: true
  cacheMissMarker: true
memory:
  backend: "off"
autolearn:
  enabled: false
  autoContinue: true