- id: llm-pi-ai # magpie
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      magpie:
        displayName: Magpie
        apiKeyEnv: MAGPIE_GATEWAY_KEY
        api: openai-completions
        baseURL: http://127.0.0.1:3425/v1
        models:
          - id: group/never-stuck
            name: 永不卡住 · routing group
            contextWindow: 1000000
            maxTokens: 384000
            input: [text, image]
            reasoningEfforts:
              max: max
          - id: group/cheap-first
            name: 便宜优先 · routing group
            contextWindow: 1000000
            maxTokens: 384000
            input: [text, image]
            reasoningEfforts:
              low: low
              high: high
              max: max
          - id: auto/deepseek-v4.1-flash
            name: DeepSeek V4.1 Flash · routing group
            contextWindow: 1000000
            maxTokens: 384000
            input: [text, image]
            reasoningEfforts:
              low: low
              high: high
              max: max
          - id: auto/glm-5.3
            name: GLM-5.3 · routing group
            contextWindow: 1000000
            maxTokens: 128000
            input: [text, image]
            reasoningEfforts:
              low: low
              high: high
              max: max
          - id: auto/glm-5.3-flash
            name: GLM-5.3-Flash · routing group
            contextWindow: 1000000
            maxTokens: 128000
            input: [text, image]
            reasoningEfforts:
              low: low
              high: high
              max: max
          - id: stepfun-cn/step-5-preview
            name: Step 5 Preview · StepFun (China)
            contextWindow: 1000000
            maxTokens: 65536
            input: [text, image]
            reasoningEfforts:
              low: low
              medium: medium
              high: high
          - id: opencode-go/beam-free
            name: Beam Free · OpenCode Go
            contextWindow: 1048576
            maxTokens: 131072
            input: [text, image]
            reasoningEfforts:
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
          - id: opencode-go/iceman-contributor-free
            name: Iceman Contributor Free · OpenCode Go
            contextWindow: 262144
            maxTokens: 65536
            input: [text, image]
          - id: opencode-go/deepseek-v4.1-flash
            name: DeepSeek V4.1 Flash · OpenCode Go
            contextWindow: 1000000
            maxTokens: 384000
            input: [text, image]
            reasoningEfforts:
              low: low
              high: high
              max: max
          - id: workbuddy/hy3
            name: Hy3 · WorkBuddy
            contextWindow: 192000
            maxTokens: 48000
            input: [text, image]
            reasoningEfforts:
              low: low
              high: high
          - id: workbuddy/deepseek-v4.1-flash
            name: DeepSeek-V4.1-Flash · WorkBuddy
            contextWindow: 1000000
            maxTokens: 128000
            input: [text, image]
            reasoningEfforts:
              "off": none
              low: low
              high: high
              max: max
      magpie-anthropic:
        displayName: Magpie · Anthropic
        apiKeyEnv: MAGPIE_GATEWAY_KEY
        api: anthropic-messages
        baseURL: http://127.0.0.1:3425
        models:
          - id: zcode/GLM-5.3
            name: GLM-5.3 · ZCode
            contextWindow: 1000000
            maxTokens: 128000
            input: [text, image]
            reasoningEfforts:
              low: low
              high: high
              max: max
            compat:
              forceAdaptiveThinking: true
          - id: zcode/GLM-5.3-Flash
            name: GLM-5.3-Flash · ZCode
            contextWindow: 1000000
            maxTokens: 128000
            input: [text, image]
            reasoningEfforts:
              low: low
              high: high
              max: max
            compat:
              forceAdaptiveThinking: true
      magpie-responses:
        displayName: Magpie · Responses
        apiKeyEnv: MAGPIE_GATEWAY_KEY
        api: openai-responses
        baseURL: http://127.0.0.1:3425/v1
        models:
          - id: grok/grok-4.7
            name: Grok 4.7 · Grok (SuperGrok)
            contextWindow: 256000
            maxTokens: 64000
            input: [text, image]
            reasoningEfforts:
              low: low
              medium: medium
              high: high
              xhigh: xhigh
- id: agent-default-model # magpie
  config:
    provider: magpie
    model: "auto/deepseek-v4.1-flash"

# 插件本体：bundle 的 patch 只贡献配置层，不会把包自己挂成 loader row。
# 缺这一段时 index.js（append-system / gate / global-context / lifecycle）
# 根本不会被加载，插件页就永远停在「已安装，重启后生效」。
- insert:
    - id: agent-extensions
      name: dsh-agent-extensions
