packages:
  - .
nodeLinker: hoisted
autoInstallPeers: false
saveExact: true
# 预览期日更版本不卡 pnpm 12 默认的 24h 供应链冷却（本体安装树同款）
minimumReleaseAge: 0
# minimumReleaseAgeExclude 已清空：原条目全部属于已移除插件
# （dsh-dream-skin/dsh-devin-cli/dsh-opencode-go web 侧）或锁定旧版本
# （cosmokit 1.8.4/schemastery 3.18.3 已升 1.8.6/3.18.5）；下次显式
# add 冷却期内版本时 pnpm 会自行重写本表
allowBuilds:
  cloudflared: true
  protobufjs: true
  esbuild: true

