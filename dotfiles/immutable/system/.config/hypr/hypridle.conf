# hypridle —— 空闲/熄屏联动 USB 断电。
#
# 熄屏本身仍由合盖事件（niri switch-events）和手动操作触发；
# 这里在空闲 15 分钟后挂起非白名单 USB 设备（见 ~/.local/bin/usb-power-gate），
# 任何输入活动或系统睡眠唤醒时立即恢复。视频播放等 Wayland idle-inhibit
# 会阻止计时，不会误触发。

general {
    after_sleep_cmd = /home/brokenshine/.local/bin/usb-power-gate resume
    ignore_dbus_inhibit = false
}

listener {
    timeout = 900
    on-timeout = /home/brokenshine/.local/bin/usb-power-gate suspend
    on-resume = /home/brokenshine/.local/bin/usb-power-gate resume
}
