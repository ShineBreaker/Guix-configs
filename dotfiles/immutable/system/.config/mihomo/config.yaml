# 本文件是模板：$MIHOMO_SUB_ONE / $MIHOMO_SUB_TWO 由 mihomo-run 启动包装
# 在 daemon 启动时从 mihomo-subscriptions.age 解密注入，
# 渲染产物为 /var/lib/mihomo/config.yaml（root:root 600，勿手改）。
# 换订阅：secrets set mihomo-subscriptions MIHOMO_SUB_ONE "<url>"（或 secrets edit）
#        && sudo herd restart mihomo-daemon

init: &init
  type: http
  interval: 86400
  health-check:
    enable: true
    url: https://www.gstatic.com/generate_204
    interval: 1800
use: &use
  type: select
  proxies:
    - DIRECT
    - AUTO
  use:
    - one
auto: &auto
  type: url-test
  url: https://www.gstatic.com/generate_204
  interval: 900
  filter: ^(?!.*[倍x]).*$
proxy-providers:
  one:
    !!merge <<: *init
    url: "$MIHOMO_SUB_ONE"
    path: proxies/one.yaml
  two:
    !!merge <<: *init
    url: "$MIHOMO_SUB_TWO"
    path: proxies/two.yaml
mixed-port: 7890
# allow-lan 若需让局域网/热点设备走本机代理再开 true；false 时仅本机可用，无开放代理暴露面
allow-lan: false
mode: rule
ipv6: true
udp: true
unified-delay: true
tcp-concurrent: true
log-level: warning
external-controller: 127.0.0.1:9090
external-ui: UI
external-ui-url: https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip
geodata-mode: true
geox-url:
  geosite: https://testingcf.jsdelivr.net/gh/v2fly/domain-list-community@release/dlc.dat
  geoip: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip-lite.dat
geo-auto-update: true
geo-update-interval: 168
profile:
  store-selected: true
  store-fake-ip: true
sniffer:
  enable: true
  sniff:
    HTTP:
      ports:
        - 80
        - 8080-8880
      override-destination: true
    TLS:
      ports:
        - 443
        - 8443
    QUIC:
      ports:
        - 443
        - 8443
  skip-domain:
    - +.mi.com
    - +.mijia.com
tun:
  enable: true
  stack: mixed
  dns-hijack:
    - any:53
    - tcp://any:53
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  route-exclude-address:
    - 10.42.0.0/24
    - 100.64.0.0/10 # Tailscale CGNAT
dns:
  enable: true
  prefer-h3: true
  listen: 127.0.0.1:53
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-filter:
    - geosite:connectivity-check
    - geosite:private
  default-nameserver:
    - 223.5.5.5
  proxy-server-nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  respect-rules: true
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  nameserver-policy:
    "geosite:cn,private":
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query
    "geosite:geolocation-!cn":
      - https://dns.google/dns-query
      - https://cloudflare-dns.com/dns-query
proxy-groups:
  - name: PROXY
    !!merge <<: *use
  - name: GAME
    !!merge <<: *use
  - name: MATCH
    !!merge <<: *use
  - name: AUTO
    !!merge <<: *auto
    use:
      - one
rule-anchor:
  ip: &ip
    type: http
    interval: 604800
    behavior: ipcidr
    format: yaml
  domain: &domain
    type: http
    interval: 604800
    behavior: domain
    format: yaml
rule-providers:
  direct:
    !!merge <<: *domain
    url: https://testingcf.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/direct.txt
    path: rules/direct.yaml
  proxy:
    !!merge <<: *domain
    url: https://testingcf.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/proxy.txt
    path: rules/proxy.yaml
  reject:
    !!merge <<: *domain
    url: https://testingcf.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/reject.txt
    path: rules/reject.yaml
rules:
  - GEOIP,lan,DIRECT,no-resolve
  - GEOSITE,private,DIRECT
  - RULE-SET,reject,REJECT
  - RULE-SET,direct,DIRECT
  - GEOSITE,geolocation-!cn@cn,DIRECT
  - GEOSITE,cn,DIRECT
  - GEOSITE,category-public-tracker,DIRECT
  - GEOSITE,category-pt,DIRECT
  - GEOSITE,category-game-platforms-download,DIRECT
  - GEOSITE,category-games-cn,DIRECT
  - GEOSITE,category-games@cn,DIRECT
  - GEOSITE,category-games,GAME
  - RULE-SET,proxy,PROXY
  - GEOSITE,geolocation-!cn,PROXY
  - GEOIP,cn,DIRECT,no-resolve
  - GEOIP,telegram,PROXY,no-resolve
  - GEOIP,google,PROXY,no-resolve
  - GEOIP,twitter,PROXY,no-resolve
  - GEOIP,netflix,PROXY,no-resolve
  - GEOIP,facebook,PROXY,no-resolve
  - GEOIP,cloudflare,PROXY,no-resolve
  - GEOIP,cloudfront,PROXY,no-resolve
  - MATCH,MATCH
