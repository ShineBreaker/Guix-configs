# 包装脚本按会话类型分流：SSH/终端走 curses，DSH 等非交互会话补 Wayland 走 Qt
pinentry-program ~/.local/bin/pinentry-wayland
pinentry-timeout 120
default-cache-ttl 600
max-cache-ttl 7200
default-cache-ttl-ssh 1800
max-cache-ttl-ssh 7200
