include                       ~/.config/kitty/themes/noctalia.conf

allow_remote_control          yes
background_opacity            0.88
background_blur               1
font_family                   maple Mono NF CN

bell_on_tab                   ""
confirm_os_window_close       -2
copy_on_select                clipboard
draw_minimal_borders          yes
focus_follows_mouse           yes
hide_window_decorations       yes
paste_actions                 quote-urls-at-prompt,confirm,confirm-if-large
pointer_shape_when_grabbed    arrow
strip_trailing_spaces         smart
window_border_width           2px
window_margin_width           0
window_padding_width          0

active_border_color           cyan
bell_border_color             red
inactive_border_color         gray
inactive_text_alpha           0.6

cursor_trail                  1
cursor_trail_start_threshold  0
show_hyperlink_targets        yes
underline_hyperlinks          hover

tab_bar_edge                  bottom
tab_bar_align                 left
tab_bar_margin_height         0.0 0.0
tab_bar_min_tabs              2
tab_bar_style                 powerline
tab_powerline_style           slanted
tab_activity_symbol           ""
# {keyboard_mode}: 前缀模式激活时显示 mode 名（如 tmux），平时为空
tab_title_template            "{keyboard_mode}{activity_symbol} {tab.last_focused_progress_percent} {index}: {title}"

update_check_interval         0
shell_integration             enabled
allow_cloning                 ask
notify_on_cmd_finish          invisible 30 notify
term                          xterm-kitty
linux_display_server          wayland
wayland_enable_ime            yes
clear_all_shortcuts           yes

# ===== 无前缀基础键（终端通用惯例，唯一的非前缀映射）=====
map ctrl+shift+c              copy_to_clipboard
map ctrl+c                    copy_or_noop
map ctrl+shift+v              paste_from_clipboard
map cmd+v                     paste_from_clipboard
map shift+insert              paste_from_selection
map ctrl+shift+f              search_scrollback
map ctrl+shift+/              command_palette

# ===== tmux 风格前缀模式（Ctrl+b，字母表与 tmux.conf 对齐）=====
# 语义对齐 tmux：前缀+字母执行后自动退出（--on-action end）、未知键 beep
# 退出（--on-unknown end）、前缀后 2 秒无后续键自动复位（--timeout）。
# 前缀双击透传（对齐 tmux 的 C-x C-x send-prefix，同时救回 readline 的
# C-b 左移）。激活指示由 tab_title_template 的 {keyboard_mode} 承担。
# tmux 场景的前缀仍是 Ctrl+x，kitty 层不拦截它。
# 未对齐项：B/f/i/T/D/G 为 tmux 侧边栏专属键，kitty 无对应。
map --new-mode T --on-unknown end --on-action end --timeout 2.0 ctrl+b

map --mode T esc           show_scrollback
map --mode T ctrl+b        send_key ctrl+b

# 分屏（对齐 tmux \ 与 -；--cwd=current 对齐 -c pane_current_path）
map --mode T \             launch --location=vsplit --cwd=current
map --mode T -             launch --location=hsplit --cwd=current

# 窗格导航与调整（对齐 tmux hjkl 与无前缀 Ctrl+方向）
map --mode T h             neighboring_window left
map --mode T j             neighboring_window down
map --mode T k             neighboring_window up
map --mode T l             neighboring_window right
map --mode T ctrl+left     resize_window wider 2
map --mode T ctrl+right    resize_window narrower 2
map --mode T ctrl+up       resize_window taller 2
map --mode T ctrl+down     resize_window shorter 2

# 新建/关闭（tmux window ≈ kitty tab，session ≈ OS window，pane ≈ window）
# 注意：kitty 键名中大写字母必须写 shift+x 形式，单写 X 会与小写同键冲突
map --mode T c             launch --type=tab --cwd=current
map --mode T shift+c       launch --type=os-window --cwd=current
map --mode T x             close_window
map --mode T shift+x       close_tab
map --mode T shift+k       close_os_window

# 工具（对齐 tmux r/?/p/[ 与默认 z zoom、数字切窗口）
map --mode T r             load_config_file
map --mode T ?             command_palette
map --mode T p             paste_from_clipboard
map --mode T [             show_scrollback
map --mode T z             toggle_layout stack
map --mode T 1             goto_tab 1
map --mode T 2             goto_tab 2
map --mode T 3             goto_tab 3
map --mode T 4             goto_tab 4
map --mode T 5             goto_tab 5
map --mode T 6             goto_tab 6
map --mode T 7             goto_tab 7
map --mode T 8             goto_tab 8
map --mode T 9             goto_tab 9
