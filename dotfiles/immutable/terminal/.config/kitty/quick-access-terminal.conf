# kitten quick-access-terminal 下拉面板配置
# 叠加在内置默认值之上；窗口本身仍按主 kitty.conf 绘制（字体/主题/tmux 前缀模式均继承）
# 完整选项见: https://sw.kovidgoyal.net/kitty/kittens/quick_access_terminal/

edge                          top
hide_on_focus_loss            yes
background_opacity            0.88

# 主 kitty.conf 的 confirm_os_window_close=-2 会弹确认，下拉终端直接关
kitty_override                confirm_os_window_close=0
# 初始布局：两个标签页分别挂 tmux/herdr 的 Quake 会话（quake.session 相对 ~/.config/kitty/）
kitty_override                startup_session=quake.session
# darkman hook 经此 socket 对面板精确下发主题（theme-common.sh），不依赖 SIGUSR1 广播
kitty_override                listen_on=unix:@kitty-quick-access
